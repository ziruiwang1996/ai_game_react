[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

# Proxy API requests to our Netlify function
[[redirects]]
  from = "/.netlify/functions/proxy/*"
  to = "/.netlify/functions/proxy/:splat"
  status = 200
  force = true

# Handle API requests with /api prefix
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/proxy/:splat"
  status = 200
  force = true

# Handle OPTIONS preflight requests for API
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/proxy/:splat"
  status = 204
  force = true
  methods = ["OPTIONS"]

# Handle client-side routing with React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Set security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' http://3.89.251.26:8000 https://*.netlify.app; connect-src 'self' http://3.89.251.26:8000 https://*.netlify.app https://*.netlify.com/.netlify/functions/* /.netlify/functions/*; img-src 'self' blob: data: http://3.89.251.26:8000; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval';"
